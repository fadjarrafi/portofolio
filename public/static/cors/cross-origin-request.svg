<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="230" rx="14" fill="#ffffff"/>

  <!-- browser -->
  <rect x="45" y="70" width="200" height="90" rx="10" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="145" y="102" text-anchor="middle" font-size="15" fill="#1c7ed6" font-weight="600">Browser</text>
  <text x="145" y="127" text-anchor="middle" font-size="13" fill="#495057" font-family="Consolas, monospace">www.domain-a.com</text>

  <!-- server -->
  <rect x="455" y="70" width="200" height="90" rx="10" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="555" y="102" text-anchor="middle" font-size="15" fill="#7048e8" font-weight="600">API</text>
  <text x="555" y="127" text-anchor="middle" font-size="13" fill="#495057" font-family="Consolas, monospace">api.domain-b.com</text>

  <!-- arrow -->
  <line x1="245" y1="115" x2="440" y2="115" stroke="#adb5bd" stroke-width="2.5"/>
  <polygon points="440,115 428,109 428,121" fill="#adb5bd"/>
  <text x="350" y="103" text-anchor="middle" font-size="13" fill="#868e96">request</text>

  <!-- blocked mark -->
  <circle cx="350" cy="115" r="16" fill="#fff5f5" stroke="#fa5252" stroke-width="2.5"/>
  <line x1="339" y1="104" x2="361" y2="126" stroke="#fa5252" stroke-width="2.5"/>

  <text x="350" y="195" text-anchor="middle" font-size="14" fill="#e03131" font-weight="600">different origin — blocked by same-origin policy</text>
</svg>
