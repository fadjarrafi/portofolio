<svg xmlns="http://www.w3.org/2000/svg" width="700" height="330" viewBox="0 0 700 330" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="330" rx="14" fill="#ffffff"/>

  <!-- ================= map ================= -->
  <text x="30" y="58" font-size="14" fill="#1c7ed6" font-weight="600" font-family="Consolas, monospace">map()</text>
  <text x="30" y="76" font-size="11" fill="#868e96">transform each</text>

  <!-- input -->
  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="150" y="42" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="170" y="64" fill="#1c7ed6">1</text>
    <rect x="196" y="42" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="216" y="64" fill="#1c7ed6">2</text>
    <rect x="242" y="42" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="262" y="64" fill="#1c7ed6">3</text>
  </g>
  <!-- op -->
  <line x1="292" y1="59" x2="386" y2="59" stroke="#adb5bd" stroke-width="2"/>
  <polygon points="392,59 380,53 380,65" fill="#adb5bd"/>
  <text x="339" y="52" text-anchor="middle" font-size="12" fill="#495057" font-family="Consolas, monospace">n * 2</text>
  <!-- output -->
  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="400" y="42" width="40" height="34" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="420" y="64" fill="#2f9e44">2</text>
    <rect x="446" y="42" width="40" height="34" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="466" y="64" fill="#2f9e44">4</text>
    <rect x="492" y="42" width="40" height="34" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="512" y="64" fill="#2f9e44">6</text>
  </g>

  <line x1="30" y1="108" x2="670" y2="108" stroke="#f1f3f5" stroke-width="1.5"/>

  <!-- ================= filter ================= -->
  <text x="30" y="168" font-size="14" fill="#1c7ed6" font-weight="600" font-family="Consolas, monospace">filter()</text>
  <text x="30" y="186" font-size="11" fill="#868e96">keep matches</text>

  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="150" y="152" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="170" y="174" fill="#1c7ed6">15</text>
    <rect x="196" y="152" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="216" y="174" fill="#1c7ed6">25</text>
    <rect x="242" y="152" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="262" y="174" fill="#1c7ed6">40</text>
  </g>
  <line x1="292" y1="169" x2="386" y2="169" stroke="#adb5bd" stroke-width="2"/>
  <polygon points="392,169 380,163 380,175" fill="#adb5bd"/>
  <text x="339" y="162" text-anchor="middle" font-size="12" fill="#495057" font-family="Consolas, monospace">n &gt;= 18</text>
  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="400" y="152" width="40" height="34" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="420" y="174" fill="#2f9e44">25</text>
    <rect x="446" y="152" width="40" height="34" rx="6" fill="#ebfbee" stroke="#37b24d" stroke-width="1.5"/>
    <text x="466" y="174" fill="#2f9e44">40</text>
  </g>

  <line x1="30" y1="218" x2="670" y2="218" stroke="#f1f3f5" stroke-width="1.5"/>

  <!-- ================= reduce ================= -->
  <text x="30" y="278" font-size="14" fill="#1c7ed6" font-weight="600" font-family="Consolas, monospace">reduce()</text>
  <text x="30" y="296" font-size="11" fill="#868e96">combine to one</text>

  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="150" y="262" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="170" y="284" fill="#1c7ed6">10</text>
    <rect x="196" y="262" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="216" y="284" fill="#1c7ed6">20</text>
    <rect x="242" y="262" width="40" height="34" rx="6" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="1.5"/>
    <text x="262" y="284" fill="#1c7ed6">30</text>
  </g>
  <line x1="292" y1="279" x2="386" y2="279" stroke="#adb5bd" stroke-width="2"/>
  <polygon points="392,279 380,273 380,285" fill="#adb5bd"/>
  <text x="339" y="272" text-anchor="middle" font-size="12" fill="#495057" font-family="Consolas, monospace">sum</text>
  <g font-family="Consolas, monospace" font-size="14" text-anchor="middle">
    <rect x="400" y="262" width="52" height="34" rx="6" fill="#f3f0ff" stroke="#7048e8" stroke-width="1.5"/>
    <text x="426" y="284" fill="#7048e8">60</text>
  </g>
</svg>
