<svg xmlns="http://www.w3.org/2000/svg" width="700" height="350" viewBox="0 0 700 350" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="350" rx="14" fill="#ffffff"/>

  <!-- PHASE 1 -->
  <text x="30" y="24" font-size="13.5" font-weight="600" fill="#495057">1. Requesting a playback token</text>

  <rect x="30" y="34" width="90" height="56" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="75" y="66" text-anchor="middle" font-size="12" fill="#1864ab" font-family="Consolas, monospace">Browser</text>

  <text x="136" y="52" text-anchor="middle" font-size="9" fill="#868e96" font-family="Consolas, monospace">GET token</text>
  <line x1="122" y1="62" x2="148" y2="62" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="150,62 142,57 142,67" fill="#adb5bd"/>

  <rect x="150" y="34" width="190" height="56" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="245" y="58" text-anchor="middle" font-size="11.5" fill="#5f3dc4" font-family="Consolas, monospace">looks up file, signs</text>
  <text x="245" y="76" text-anchor="middle" font-size="11" fill="#5f3dc4" font-family="Consolas, monospace">HMAC-SHA256 token</text>

  <text x="356" y="52" text-anchor="middle" font-size="9" fill="#868e96" font-family="Consolas, monospace">60s expiry</text>
  <line x1="342" y1="62" x2="368" y2="62" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="374,62 365,57 365,67" fill="#adb5bd"/>

  <rect x="378" y="34" width="180" height="56" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="468" y="58" text-anchor="middle" font-size="11.5" fill="#2b8a3e" font-family="Consolas, monospace">browser holds token</text>
  <text x="468" y="76" text-anchor="middle" font-size="10" fill="#495057" font-family="Consolas, monospace">not a file path</text>

  <!-- divider -->
  <line x1="30" y1="104" x2="670" y2="104" stroke="#e9ecef" stroke-width="1.5"/>

  <!-- PHASE 2 -->
  <text x="30" y="126" font-size="13.5" font-weight="600" fill="#495057">2. Serving the actual bytes</text>

  <rect x="30" y="136" width="190" height="56" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="125" y="160" text-anchor="middle" font-size="11" fill="#1864ab" font-family="Consolas, monospace">GET /video/{token}</text>
  <text x="125" y="178" text-anchor="middle" font-size="10" fill="#495057" font-family="Consolas, monospace">to the web app</text>

  <line x1="222" y1="164" x2="248" y2="164" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="254,164 245,159 245,169" fill="#adb5bd"/>

  <rect x="258" y="136" width="210" height="56" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="363" y="160" text-anchor="middle" font-size="11" fill="#5f3dc4" font-family="Consolas, monospace">verify signature + expiry</text>
  <text x="363" y="178" text-anchor="middle" font-size="10" fill="#5f3dc4" font-family="Consolas, monospace">same shared secret</text>

  <!-- branch -->
  <line x1="363" y1="192" x2="363" y2="210" stroke="#adb5bd" stroke-width="1.5"/>

  <line x1="363" y1="210" x2="245" y2="240" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="237,244 249,238 251,248" fill="#2f9e44"/>
  <text x="272" y="224" text-anchor="middle" font-size="10.5" fill="#2f9e44">valid + fresh</text>

  <line x1="363" y1="210" x2="480" y2="240" stroke="#e03131" stroke-width="1.5"/>
  <polygon points="488,244 476,238 474,248" fill="#e03131"/>
  <text x="452" y="224" text-anchor="middle" font-size="10.5" fill="#e03131">expired or invalid</text>

  <!-- outcomes -->
  <rect x="140" y="250" width="210" height="60" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="245" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#2b8a3e" font-family="Consolas, monospace">STREAMS THE FILE</text>
  <text x="245" y="294" text-anchor="middle" font-size="10" fill="#495057">read from outside the webroot</text>

  <rect x="380" y="250" width="210" height="60" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="485" y="276" text-anchor="middle" font-size="13" font-weight="600" fill="#c92a2a" font-family="Consolas, monospace">403, NOTHING SERVED</text>
  <text x="485" y="294" text-anchor="middle" font-size="10" fill="#495057">no file path was ever exposed</text>

  <text x="350" y="332" text-anchor="middle" font-size="10.5" fill="#868e96">the two services share only the signing secret — never a database</text>
</svg>
