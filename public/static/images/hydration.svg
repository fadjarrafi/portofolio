<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" rx="14" fill="#ffffff"/>

  <text x="350" y="20" text-anchor="middle" font-size="11.5" fill="#868e96" font-family="Consolas, monospace">hydrateRoot(existingDOM, &lt;App /&gt;)</text>
  <line x1="350" y1="26" x2="350" y2="40" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="350,46 345,37 355,37" fill="#adb5bd"/>

  <!-- walk boundary -->
  <rect x="70" y="48" width="560" height="108" rx="12" fill="#f3f0ff" stroke="#7048e8" stroke-width="2" stroke-dasharray="6 4"/>

  <rect x="100" y="72" width="230" height="56" rx="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="215" y="96" text-anchor="middle" font-size="12" fill="#1864ab" font-family="Consolas, monospace">Walk DOM node</text>
  <text x="215" y="114" text-anchor="middle" font-size="11" fill="#495057" font-family="Consolas, monospace">tag, attrs, children</text>

  <line x1="332" y1="100" x2="366" y2="100" stroke="#9775fa" stroke-width="2"/>
  <polygon points="372,100 362,95 362,105" fill="#9775fa"/>
  <text x="349" y="90" text-anchor="middle" font-size="10" fill="#7048e8">then</text>

  <rect x="370" y="72" width="230" height="56" rx="8" fill="#ffffff" stroke="#1c7ed6" stroke-width="1.5"/>
  <text x="485" y="96" text-anchor="middle" font-size="12" fill="#1864ab" font-family="Consolas, monospace">Compare to expected</text>
  <text x="485" y="114" text-anchor="middle" font-size="11" fill="#495057" font-family="Consolas, monospace">what render() would output</text>

  <!-- branch -->
  <line x1="350" y1="156" x2="350" y2="172" stroke="#adb5bd" stroke-width="1.5"/>
  <line x1="350" y1="172" x2="220" y2="206" stroke="#2f9e44" stroke-width="1.5"/>
  <polygon points="212,210 222,203 226,213" fill="#2f9e44"/>
  <text x="230" y="188" text-anchor="middle" font-size="10.5" fill="#2f9e44">matches</text>

  <line x1="350" y1="172" x2="480" y2="206" stroke="#e03131" stroke-width="1.5"/>
  <polygon points="488,210 474,203 478,213" fill="#e03131"/>
  <text x="470" y="188" text-anchor="middle" font-size="10.5" fill="#e03131">mismatch</text>

  <!-- outcomes -->
  <rect x="105" y="212" width="230" height="70" rx="10" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="220" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#2b8a3e" font-family="Consolas, monospace">ATTACH</text>
  <text x="220" y="260" text-anchor="middle" font-size="10.5" fill="#495057">listeners wired, node reused</text>

  <rect x="365" y="212" width="230" height="70" rx="10" fill="#fff5f5" stroke="#e03131" stroke-width="2"/>
  <text x="480" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#c92a2a" font-family="Consolas, monospace">DISCARD</text>
  <text x="480" y="260" text-anchor="middle" font-size="10.5" fill="#495057">rebuilt from scratch, client-side</text>
</svg>
