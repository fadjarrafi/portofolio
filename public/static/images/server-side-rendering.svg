<svg xmlns="http://www.w3.org/2000/svg" width="700" height="300" viewBox="0 0 700 300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="300" rx="14" fill="#ffffff"/>

  <!-- CLIENT-SIDE RENDERING -->
  <text x="30" y="24" font-size="13.5" font-weight="600" fill="#495057">Client-side rendering — blank until JS finishes</text>

  <rect x="30" y="38" width="70" height="44" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="65" y="65" text-anchor="middle" font-size="11.5" fill="#1864ab" font-family="Consolas, monospace">Request</text>

  <rect x="112" y="38" width="130" height="44" rx="8" fill="#f8f9fa" stroke="#adb5bd" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="177" y="65" text-anchor="middle" font-size="11.5" fill="#868e96" font-family="Consolas, monospace">Blank page</text>

  <rect x="254" y="38" width="190" height="44" rx="8" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="349" y="58" text-anchor="middle" font-size="11.5" fill="#e67700" font-family="Consolas, monospace">Download + run JS</text>
  <text x="349" y="73" text-anchor="middle" font-size="10" fill="#e67700">nothing on screen yet</text>

  <rect x="456" y="38" width="170" height="44" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="541" y="65" text-anchor="middle" font-size="11.5" fill="#2b8a3e" font-family="Consolas, monospace">Content appears</text>

  <line x1="30" y1="96" x2="655" y2="96" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="666,96 654,90 654,102" fill="#adb5bd"/>
  <text x="618" y="112" font-size="11" fill="#868e96">time</text>

  <!-- SERVER-SIDE RENDERING -->
  <text x="30" y="140" font-size="13.5" font-weight="600" fill="#495057">Server-side rendering — content first, JS hydrates after</text>

  <text x="30" y="164" font-size="10.5" fill="#868e96">Response</text>

  <rect x="90" y="170" width="64" height="32" rx="7" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="122" y="191" text-anchor="middle" font-size="10.5" fill="#1864ab" font-family="Consolas, monospace">Request</text>

  <rect x="166" y="170" width="160" height="32" rx="7" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="246" y="191" text-anchor="middle" font-size="10.5" fill="#5f3dc4" font-family="Consolas, monospace">Server renders HTML</text>

  <rect x="338" y="170" width="150" height="32" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="413" y="191" text-anchor="middle" font-size="10.5" fill="#2b8a3e" font-family="Consolas, monospace">Content appears</text>

  <line x1="338" y1="202" x2="338" y2="216" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="650" y1="202" x2="650" y2="216" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="3 3"/>

  <text x="30" y="234" font-size="10.5" fill="#868e96">Client JS</text>
  <rect x="338" y="216" width="312" height="26" rx="6" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="494" y="233" text-anchor="middle" font-size="10.5" fill="#495057">hydrating — attaching event listeners in the background</text>
</svg>
