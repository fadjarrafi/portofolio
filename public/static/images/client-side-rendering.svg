<svg xmlns="http://www.w3.org/2000/svg" width="700" height="290" viewBox="0 0 700 290" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="290" rx="14" fill="#ffffff"/>

  <!-- INITIAL LOAD -->
  <text x="30" y="24" font-size="13.5" font-weight="600" fill="#495057">Initial load</text>

  <rect x="30" y="34" width="80" height="44" rx="8" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
  <text x="70" y="61" text-anchor="middle" font-size="11.5" fill="#1864ab" font-family="Consolas, monospace">Request</text>

  <line x1="112" y1="56" x2="132" y2="56" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="140,56 130,51 130,61" fill="#adb5bd"/>

  <rect x="144" y="34" width="200" height="44" rx="8" fill="#f3f0ff" stroke="#7048e8" stroke-width="2"/>
  <text x="244" y="61" text-anchor="middle" font-size="11.5" fill="#5f3dc4" font-family="Consolas, monospace">Core bundle (app + router)</text>

  <line x1="346" y1="56" x2="366" y2="56" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="374,56 364,51 364,61" fill="#adb5bd"/>

  <rect x="378" y="34" width="130" height="44" rx="8" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="443" y="61" text-anchor="middle" font-size="11.5" fill="#2b8a3e" font-family="Consolas, monospace">Home renders</text>

  <!-- divider -->
  <line x1="30" y1="100" x2="670" y2="100" stroke="#e9ecef" stroke-width="1.5"/>
  <text x="30" y="122" font-size="13.5" font-weight="600" fill="#495057">Later — clicking a link never leaves the page</text>

  <!-- NAV TO DASHBOARD -->
  <rect x="30" y="134" width="96" height="34" rx="7" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="78" y="156" text-anchor="middle" font-size="10.5" fill="#868e96" font-family="Consolas, monospace">navigate()</text>

  <line x1="126" y1="151" x2="146" y2="151" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="154,151 144,146 144,156" fill="#adb5bd"/>

  <rect x="158" y="134" width="210" height="34" rx="7" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="263" y="156" text-anchor="middle" font-size="10.5" fill="#e67700" font-family="Consolas, monospace">fetch dashboard.chunk.js</text>

  <line x1="368" y1="151" x2="388" y2="151" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="396,151 386,146 386,156" fill="#adb5bd"/>

  <rect x="408" y="134" width="170" height="34" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="493" y="156" text-anchor="middle" font-size="10.5" fill="#2b8a3e" font-family="Consolas, monospace">Dashboard renders</text>

  <!-- NAV TO SETTINGS -->
  <rect x="30" y="188" width="96" height="34" rx="7" fill="#f8f9fa" stroke="#adb5bd" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="78" y="210" text-anchor="middle" font-size="10.5" fill="#868e96" font-family="Consolas, monospace">navigate()</text>

  <line x1="126" y1="205" x2="146" y2="205" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="154,205 144,200 144,210" fill="#adb5bd"/>

  <rect x="158" y="188" width="210" height="34" rx="7" fill="#fff9db" stroke="#f08c00" stroke-width="2"/>
  <text x="263" y="210" text-anchor="middle" font-size="10.5" fill="#e67700" font-family="Consolas, monospace">fetch settings.chunk.js</text>

  <line x1="368" y1="205" x2="388" y2="205" stroke="#adb5bd" stroke-width="1.5"/>
  <polygon points="396,205 386,200 386,210" fill="#adb5bd"/>

  <rect x="408" y="188" width="170" height="34" rx="7" fill="#ebfbee" stroke="#2f9e44" stroke-width="2"/>
  <text x="493" y="210" text-anchor="middle" font-size="10.5" fill="#2b8a3e" font-family="Consolas, monospace">Settings renders</text>

  <text x="350" y="254" text-anchor="middle" font-size="10.5" fill="#868e96">no new HTML request to the server, at any step</text>
</svg>
