server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx only listens on HTTP behind Cloudflare, so absolute redirects would
    # rewrite https:// requests to http:// and Google flags them as redirect errors.
    absolute_redirect off;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Serves the styled page while keeping a real 404 status; naming 404.html
    # directly in try_files would return it with 200 as a soft 404.
    error_page 404 /404.html;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # add_header would append a second Content-Type instead of replacing
    # nginx's default text/xml, producing a malformed response.
    location ~* \.xml$ {
        types { }
        default_type application/xml;
    }
}
