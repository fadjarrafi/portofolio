name: Deploy to Cloudflare Pages

# Runs alongside deploy.yml (Docker/GHCR/homeserver) until the DNS cutover is
# done and Pages has been stable. It stays inert until the repository variable
# CF_PAGES_ENABLED is set to "true", so merging this file changes nothing.
#
# Secrets:   CLOUDFLARE_API_TOKEN (permission: Account > Cloudflare Pages > Edit),
#            CLOUDFLARE_ACCOUNT_ID, PUBLIC_GA_ID (same one deploy.yml uses)
# Variables: CF_PAGES_ENABLED, optionally CF_PAGES_PROJECT (default: portofolio)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-pages-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy to Pages
    runs-on: ubuntu-latest
    # Fork PRs get no secrets, so they are skipped rather than failed.
    if: >-
      vars.CF_PAGES_ENABLED == 'true' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # Shallow clone is enough: sitemap lastmod is read from content
        # frontmatter (astro.config.mjs), not from git history. If that ever
        # changes to `git log`, add `fetch-depth: 0` here.

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          # packageManager in package.json pins bun@1.3.7, same as the Dockerfile.
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build
        env:
          NODE_ENV: production
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # main -> production deployment; any other branch -> preview at
          # <branch>.<project>.pages.dev. The Pages project's production
          # branch must be set to "main".
          command: >-
            pages deploy dist
            --project-name=${{ vars.CF_PAGES_PROJECT || 'portofolio' }}
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.event.pull_request.head.sha || github.sha }}
            --commit-dirty=true
